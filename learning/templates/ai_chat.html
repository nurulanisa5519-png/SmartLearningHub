{% extends 'base.html' %}

{% block title %}
Smart Learning AI
{% endblock %}

{% block content %}

<style>

.ai-card{
    max-width:900px;
    margin:20px auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    overflow:hidden;
}

.ai-header{
    background:#2563eb;
    color:#fff;
    padding:15px 20px;
    font-size:24px;
    font-weight:bold;
}

.ai-body{
    padding:20px;
}

.chat-box{
    height:420px;
    overflow-y:auto;
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
}

/* Bubble Mahasiswa */

.user-chat{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.user-chat div{
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:15px 15px 0 15px;
    max-width:70%;
    word-wrap:break-word;
}

/* Bubble AI */

.ai-chat{
    display:flex;
    justify-content:flex-start;
    margin-bottom:20px;
}

.ai-chat .bubble{
    background:white;
    border:1px solid #ddd;
    border-radius:15px 15px 15px 0;
    padding:18px;
    max-width:85%;
    line-height:1.8;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* Tampilan HTML dari AI */

.ai-chat .bubble p{
    margin-bottom:12px;
}

.ai-chat .bubble h1,
.ai-chat .bubble h2,
.ai-chat .bubble h3{
    margin-top:10px;
    margin-bottom:10px;
    color:#2563eb;
}

.ai-chat .bubble ul,
.ai-chat .bubble ol{
    margin-left:20px;
    margin-bottom:12px;
}

.ai-chat .bubble code{
    background:#f1f1f1;
    padding:2px 6px;
    border-radius:4px;
}

.ai-chat .bubble pre{
    background:#272822;
    color:white;
    padding:15px;
    border-radius:8px;
    overflow-x:auto;
}

textarea{
    width:100%;
    height:80px;
    resize:none;
    border-radius:10px;
    border:1px solid #ccc;
    padding:12px;
    font-size:15px;
    margin-top:20px;
}

.btn-ai{
    margin-top:15px;
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 25px;
    border-radius:8px;
    cursor:pointer;
}

.btn-ai:hover{
    background:#15803d;
}

</style>

<div class="ai-card">

    <div class="ai-header">
        🤖 Smart Learning AI
    </div>

    <div class="ai-body">

        <div class="chat-box">

            {% if pertanyaan %}

            <div class="user-chat">
                <div>
                    {{ pertanyaan }}
                </div>
            </div>

            {% endif %}

            {% if jawaban %}

            <div class="ai-chat">

                <div class="bubble">

                    {{ jawaban|safe }}

                </div>

            </div>

            {% endif %}

        </div>

        <form method="POST">

            {% csrf_token %}

            <textarea
                name="pertanyaan"
                placeholder="Tanyakan materi perkuliahan...">{{ pertanyaan }}</textarea>

            <button type="submit" class="btn-ai">
                🚀 Kirim Pertanyaan
            </button>

        </form>

    </div>

</div>

{% endblock %}
